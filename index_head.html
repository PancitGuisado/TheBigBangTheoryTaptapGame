<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Big Bang Theory: Pasadena Idle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { amber: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 900: '#78350f', 950: '#451a03' } },
                    fontFamily: { sans: ['"Press Start 2P"', 'monospace'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?bust=1781508899092&v=1781521065730">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-950 text-white h-screen flex flex-col overflow-hidden select-none text-[11px]">
    <!-- Top Bar -->
    <div class="h-10 bg-gradient-to-r from-amber-950 to-stone-900 border-b-2 border-amber-900/50 flex items-center justify-between px-2 sm:px-4 z-[100] relative shrink-0 shadow-[0_2px_10px_rgba(0,0,0,0.5)]">
        <div class="flex items-center gap-2">
            <span class="text-amber-500 font-black text-sm tracking-widest drop-shadow-[0_0_5px_rgba(245,158,11,0.5)]">TBBT</span>
            <span class="bg-black/50 px-2 py-0.5 rounded border border-amber-900/30 text-[8px] text-amber-400 font-bold uppercase" id="top-bar-gang-size">GANG: 0/1</span>
        </div>
        
        <div class="flex items-center gap-3">
            <div id="boss-rush-toggle" class="hidden items-center gap-1.5 bg-red-950/80 px-2 py-0.5 rounded border border-red-900/50 cursor-pointer hover:bg-red-900 transition-colors" onclick="toggleBossRushMode()">
                <span class="text-[8px] text-red-400 font-bold uppercase tracking-widest animate-pulse">Boss Rush</span>
                <span id="boss-rush-counter" class="text-white text-[8px] font-mono">0/5</span>
            </div>
            <div class="flex items-center gap-1.5 bg-black/40 px-2 py-0.5 rounded border border-white/5">
                <span class="text-gray-400">⏱️</span>
                <span id="time-display" class="font-mono text-amber-500 font-bold text-[10px] tracking-widest">00:00:00</span>
            </div>
            
            <button onclick="openLeaderboard()" class="text-yellow-500 hover:text-yellow-400 cursor-pointer transition-colors drop-shadow-[0_0_5px_rgba(234,179,8,0.5)]" title="Leaderboard">
                <span class="text-sm">🏆</span>
            </button>
            <button onclick="openSettings()" class="text-gray-400 hover:text-white cursor-pointer transition-colors" title="Settings">
                <span class="text-sm">⚙️</span>
            </button>
        </div>
    </div>
    
    <!-- MAIN GAME AREA (Arena) -->
    <div id="arena" onclick="handleArenaTap(event)" class="flex-1 relative bg-gradient-to-b from-gray-900 to-gray-950" style="min-height:0;overflow:hidden;clip:rect(0,auto,auto,0);padding-bottom:48px;">
        <!-- Cinematic Effects Layer -->
        <div id="arena-effects-layer" class="absolute inset-0 z-[5] pointer-events-none" style="overflow:hidden;"></div>
        
        <!-- Dynamic Map Background -->
        <div id="dynamic-map-bg" class="absolute inset-0 z-0 opacity-100 transition-all duration-1000" style="background-image: repeating-linear-gradient(45deg, #1f140d 25%, transparent 25%, transparent 75%, #1f140d 75%, #1f140d), repeating-linear-gradient(45deg, #1f140d 25%, #2a1a0e 25%, #2a1a0e 75%, #1f140d 75%, #1f140d); background-position: 0 0, 20px 20px; background-size: 40px 40px;"></div>
        
        <!-- Hangout / Location Layout Elements -->
        <div id="hangout-hotspots" class="absolute inset-0 z-10 pointer-events-none"></div>

        <div id="dynamic-hotspots" class="absolute inset-0 z-25 pointer-events-none hidden"></div>

        <!-- Damage Popups Container -->
        <div id="damage-container" class="absolute inset-0 z-50 pointer-events-none"></div>

        <!-- ENEMY BATTLE SLOT (right side) -->
        <div id="enemy-battle-slot" class="absolute right-[5%] bottom-[20%] z-20 flex flex-col items-center pointer-events-none transition-transform">
            <div id="boss-warning" class="hidden absolute -top-12 text-red-500 font-black text-xl tracking-widest uppercase animate-pulse drop-shadow-[0_0_10px_rgba(239,68,68,0.8)] z-50 whitespace-nowrap">WARNING: BOSS</div>
            <div id="enemy-sprite" class="w-24 h-32 relative filter drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)] pointer-events-auto cursor-crosshair"></div>
            <div class="mt-2 text-center w-full max-w-[120px] bg-black/60 p-1.5 rounded border border-red-900/50 backdrop-blur-sm pointer-events-auto shadow-lg">
                <div id="enemy-name" class="font-black text-[9px] text-red-400 tracking-wider uppercase truncate drop-shadow-md">---</div>
                <div class="w-full bg-gray-900 h-1.5 mt-1 rounded overflow-hidden border border-gray-800">
                    <div id="enemy-hp-bar" class="bg-gradient-to-r from-red-600 to-red-400 h-full transition-all duration-200" style="width:100%"></div>
                </div>
            </div>
        </div>

        <!-- PLAYER BATTLE LINE (characters on left) -->
        <div id="player-battle-line" class="absolute left-[3%] bottom-[20%] z-20 flex items-end gap-1 pointer-events-none">
            <div id="line-back" class="flex items-end gap-1"></div>
            <div id="line-mid" class="flex items-end gap-1"></div>
            <div id="line-front" class="flex items-end gap-1"></div>
        </div>

        <!-- ROBOT LINE: BIG BOTS (behind characters, offset right) -->
        <div id="robot-line-big" class="absolute left-[25%] bottom-[26%] z-15 flex items-end gap-3 pointer-events-none"></div>

        <!-- ROBOT LINE: SMALL BOTS (in front of characters, offset right) -->
        <div id="robot-line-small" class="absolute left-[22%] bottom-[16%] z-25 flex items-end gap-2 pointer-events-none"></div>

        <!-- SYNERGY / FORMATION BONUS (top left) -->
        <div id="synergy-display" class="absolute top-4 left-4 z-40 flex flex-col gap-1 pointer-events-none"></div>
        
        <!-- QUICK REPAIR NOTIFICATION (left side) -->
        <div id="quick-repair-container" class="absolute top-20 left-4 z-40 flex flex-col gap-2 pointer-events-auto"></div>

        <!-- RIGHT SIDE RAIL: Quick Access Buttons -->
        <div id="right-side-rail" class="absolute right-2 top-1/2 transform -translate-y-1/2 flex flex-col gap-2 z-[60]">
            <button onclick="openLineupEditor()" class="side-rail-btn group relative" title="The Whiteboard">
                <span class="text-base">📋</span>
                <span class="side-rail-label">Skills</span>
            </button>
            <button onclick="openMapBrowser()" class="side-rail-btn group relative" title="Campus Map">
                <span class="text-base">🗺️</span>
                <span class="side-rail-label">Map</span>
            </button>
            <button onclick="openFoodModal()" class="side-rail-btn group relative" title="Cafeteria">
                <span class="text-base">🍔</span>
                <span class="side-rail-label">Food</span>
            </button>
            <button onclick="openQuestModal()" class="side-rail-btn group relative" title="Quests">
                <span class="text-base">📜</span>
                <span class="side-rail-label">Quest</span>
                <span id="quest-badge" class="side-rail-badge hidden">!</span>
            </button>
            <button onclick="openAchievementsModal()" class="side-rail-btn group relative" title="Achievements">
                <span class="text-base">🏅</span>
                <span class="side-rail-label">Feats</span>
                <span id="achievement-badge" class="side-rail-badge hidden">0</span>
            </button>
            <button onclick="openGearModal()" class="side-rail-btn group relative" title="Gear & Relics">
                <span class="text-base">🎒</span>
                <span class="side-rail-label">Gear</span>
            </button>
            <button onclick="openEventModal()" class="side-rail-btn group relative" title="Active Event">
                <span class="text-base">📅</span>
                <span class="side-rail-label">Event</span>
            </button>
            <button onclick="openMinigameModal()" class="side-rail-btn group relative" title="Fun with Flags">
                <span class="text-base">🎮</span>
                <span class="side-rail-label">Play</span>
            </button>
            <button onclick="openDailyRewardsModal()" class="side-rail-btn group relative" title="Daily Rewards">
                <span class="text-base">🎁</span>
                <span class="side-rail-label">Daily</span>
                <span id="daily-badge" class="side-rail-badge hidden">!</span>
            </button>
        </div>
        
        <!-- BOTTOM BAR: Core Navigation (5 tabs) -->
        <div id="bottom-nav" class="absolute bottom-0 left-0 right-0 z-[60] flex items-stretch justify-around pointer-events-auto" style="background:linear-gradient(180deg,#2a1a0e,#1a100a);border-top:2px solid #4a2e18;box-shadow:0 -2px 12px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.04);">
            <button onclick="openLineupEditor()" class="bottom-tab group" data-tab="board">
                <span class="text-lg group-hover:scale-110 transition-transform">📋</span>
                <span class="bottom-tab-label text-amber-400">Board</span>
            </button>
            <button onclick="openRosterModal()" class="bottom-tab group" data-tab="gang">
                <span class="text-lg group-hover:scale-110 transition-transform">👥</span>
                <span class="bottom-tab-label text-amber-400">Gang</span>
            </button>
            <button id="arena-tab-btn" onclick="openArenaModal()" class="bottom-tab group active" data-tab="arena">
                <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-amber-500 rounded-full p-2 border-2 border-amber-900 shadow-[0_0_15px_rgba(245,158,11,0.5)] z-10 group-hover:-translate-y-1 transition-transform">
                    <span class="text-xl">⚔️</span>
                </div>
                <span class="bottom-tab-label text-amber-400 mt-5">Arena</span>
            </button>
            <button onclick="toggleHospitalPlace(event)" class="bottom-tab group" data-tab="clinic">
                <span class="text-lg group-hover:scale-110 transition-transform">🏥</span>
                <span class="bottom-tab-label text-amber-400">Clinic</span>
            </button>
            <button onclick="openRobotsModal(event)" class="bottom-tab group" data-tab="bots">
                <span class="text-lg group-hover:scale-110 transition-transform">🤖</span>
                <span class="bottom-tab-label text-amber-400">Bots</span>
            </button>
        </div>
    </div>

    <!-- HOSPITAL PLACE -->
    <div id="hospital-place" class="hidden flex-1 relative overflow-hidden bg-gradient-to-b from-gray-900 to-gray-950"></div>
    
    <!-- STORY CUTSCENE OVERLAY -->
    <div id="story-cutscene-overlay" class="fixed inset-0 z-[200] bg-black hidden flex-col items-center justify-center">
        <div id="cutscene-bg" class="absolute inset-0 z-0 opacity-40"></div>
        <div id="cutscene-effects" class="absolute inset-0 z-10 pointer-events-none"></div>
        <div class="z-20 max-w-lg w-full px-4 flex flex-col items-center">
            <div id="cutscene-image" class="w-full h-48 bg-gray-900 border-2 border-amber-500/30 rounded-xl mb-6 shadow-[0_0_30px_rgba(245,158,11,0.2)] overflow-hidden flex items-center justify-center relative"></div>
            <div id="cutscene-title" class="text-amber-400 font-black text-xl mb-2 tracking-widest text-center uppercase drop-shadow-md"></div>
            <div id="cutscene-text" class="text-white text-sm leading-loose text-center mb-8 min-h-[80px]"></div>
            <button id="cutscene-next-btn" class="bg-amber-600 hover:bg-amber-500 text-black font-bold py-3 px-8 rounded border-2 border-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.4)] transition-all cursor-pointer uppercase tracking-widest hidden">Continue</button>
        </div>
    </div>
